events {}

http {
  # Use Docker internal DNS so nginx can resolve service names that appear after startup
  resolver 127.0.0.11 valid=30s;

  upstream backend {
    server api1:9999;
    server api2:9999;
  }

  server {
    listen 9999;

    location / {
      # Avoid nginx validating upstream hostnames at startup by using a runtime
      # variable and Docker's internal DNS resolver (127.0.0.11).
      # This proxies to api1 first; restart nginx to pick up any new addresses.
      set $upstream "api1:9999";
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
