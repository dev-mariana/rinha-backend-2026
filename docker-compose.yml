version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '30M'

  api1:
    build: .
    environment:
      - PORT=9999
    expose:
      - "9999"
    command: ["bun", "run", "src/index.ts"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '0.425'
          memory: '160M'

  api2:
    build: .
    environment:
      - PORT=9999
    expose:
      - "9999"
    command: ["bun", "run", "src/index.ts"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '0.425'
          memory: '160M'
